services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: razormesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: razormesh
      POSTGRES_PASSWORD: razormesh_dev
      POSTGRES_DB: razormesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razormesh -d razormesh"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: razormesh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
