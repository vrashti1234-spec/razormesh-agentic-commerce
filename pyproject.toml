[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "razormesh-agentic-commerce"
version = "0.1.0"
description = "RazorMesh agentic commerce trust and payment layer prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "langchain",
    "langgraph",
    "langchain-openai",
    "langchain-community",
    "pydantic",
    "pydantic-settings",
    "razorpay",
    "redis",
    "pgvector",
    "structlog",
    "httpx",
    "pytest",
    "pytest-asyncio",
]
